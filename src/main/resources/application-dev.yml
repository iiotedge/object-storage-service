server:
  port: 8060

spring:
  config:
    activate:
      on-profile: dev
  application:
    name: Object-Storage-Service
  datasource:
    url: jdbc:postgresql://localhost:5432/iotmining
    username: postgres
    password: 8506
    hikari:
      pool-name: LoginServicePool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 2000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql

# MinIO Configuration
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:iotmining-rms}

services:
  device-service:
    # Uses env var DEVICE_SERVICE_URL; defaults to localhost:8055 if not set
    url: ${DEVICE_SERVICE_URL:http://localhost:8055}
  device-profile-service:
    # Uses env var DEVICE_PROFILE_SERVICE_URL; defaults to localhost:8056 if not set
    url: ${DEVICE_PROFILE_SERVICE_URL:http://localhost:8056}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
